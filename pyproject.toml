[tool.poetry]
name = "webhooks-bridge"
version = "0.2.0"
description = "A simple webhook receiver that filters, transforms and forwards webhooks"
repository = "https://github.com/luebke-dev/webhooks-bridge"
authors = ["Sebastian Lübke <github@luebke.io>"]
readme = "README.md"
packages = [{include = "webhooks_bridge"}]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.110.0"
pyyaml = "^6.0.1"
jinja2 = "^3.1.3"
uvicorn = "^0.27.0"
httpx = "^0.26.0"
aiofiles = "^23.2.0"
pydantic = "^2.5.0"
pydantic-settings = "^2.1.0"

[tool.poetry.group.dev.dependencies]
ruff = "^0.1.15"
black = "^24.2.0"
httpie = "^3.2.1"
pytest = "^8.0.0"
pytest-asyncio = "^0.23.5"
mypy = "^1.8.0"
types-aiofiles = "^23.2.0"
types-pyyaml = "^6.0.12"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[tool.ruff]
select = ["E", "F", "I", "N", "W", "B", "UP"]
ignore = ["E501"]  # Line too long
target-version = "py311"

[tool.black]
target-version = ["py311"]
line-length = 88
